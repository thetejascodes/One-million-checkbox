<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Million Checkboxes</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="hero">
            <h1>One Million Checkboxes</h1>
            <div class="status" id="status">Connecting...</div>
        </section>

        <div id="checkbox-container"></div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const container = document.getElementById('checkbox-container');
        const status = document.getElementById('status');
        const TOTAL = 1000000;

        socket.on('connect', () => status.textContent = `Connected · ${TOTAL.toLocaleString()} checkboxes`)
        socket.on('disconnect', () => status.textContent = 'Disconnected')

        window.addEventListener('load', async () => {
            status.textContent = 'Loading...'

            const response = await fetch('/checkboxes')
            const { checked } = await response.json()

            const fragment = document.createDocumentFragment()

            for (let index = 0; index < TOTAL; index++) {
                const checkbox = document.createElement('input')
                checkbox.type = 'checkbox'
                checkbox.id = `cb-${index}`
                checkbox.checked = checked[index] === '1'

                checkbox.addEventListener('change', (e) => {
                    socket.emit('client:checkbox:changed', {
                        index,
                        checked: e.target.checked
                    })
                })

                fragment.appendChild(checkbox)
            }

            container.appendChild(fragment)
            status.textContent = `Connected · ${TOTAL.toLocaleString()} checkboxes`
        })

        socket.on('server:checkbox:changed', ({ index, checked }) => {
            const checkbox = document.getElementById(`cb-${index}`)
            if (checkbox) checkbox.checked = checked
        })
    </script>
</body>

</html>
