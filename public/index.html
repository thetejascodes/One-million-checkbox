<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Million Checkboxes</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="hero">
            <h1>One Million Checkboxes</h1>
        </section>

        <div id="checkbox-container">
        </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const checkboxContainer = document.getElementById('checkbox-container');
        window.addEventListener('load', async () => {
            const response = await fetch('/checkboxes', { method: 'GET' })
            const data = await response.json()
            if (data && data.checkboxes) {
                data.checkboxes.forEach((checked, index) => {
                    const checkbox = document.createElement('input')
                    checkbox.type = 'checkbox'
                    checkbox.id = `checkbox-${index}`
                    checkbox.checked = checked;
                    checkbox.addEventListener('change', event => {
                        const checked = event.target.checked
                        console.log(`Checkboxes Changed ${index}  ${checked}`)
                        socket.emit('client:checkbox:changed', { index, checked })
                    })
                                    checkboxContainer.appendChild(checkbox)


                })
            }
        })
        socket.on('server:checkbox:changed', (data) => {
            console.log(`Checkboxes Changed ${data.index}  ${data.checked}`)
            const { index, checked } = data;
            const checkbox = document.getElementById(`checkbox-${index}`)
            if (checkbox) {
                checkbox.checked = checked;
            }
        })
    </script>
</body>

</html>
